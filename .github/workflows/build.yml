on:
  pull_request:
    branches:
      - main
      - rel-2150
      - sta-2150
  push:
    branches:
      - main
      - "rel-*"

  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  build:
    uses: gardenlinux/package-build/.github/workflows/build.yml@0378caf3003ef453620b2e4312199e11e67955a7 # main
    with:
      release: false
      # set publish release to true if we have no PR
      publish_release: ${{ github.event_name != 'pull_request' }}
