on:
  pull_request:
    branches:
      - main
      - rel-1877
      - sta-1877
  push:
    branches:
      - main
      - "rel-*"
      - "sta-*"

  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  build:
    permissions:
      contents: write
    uses: gardenlinux/package-build/.github/workflows/build.yml@c6a92703b5b88b2c5086e51469fef5ad7755391c # main
    with:
      release: false
      # set publish release to true if we have no PR
      publish_release: ${{ github.event_name != 'pull_request' }}
